[project]
name = "simple-pos-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Arabic text is intentional (BR §9)
    "RUF012",  # DRF declares permission/throttle classes as mutable class attributes by design
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101", "S105", "S106"]
"config/settings/*.py" = ["F405"]
"scripts/*.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/", "apps/.*/tests/"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["config.settings.*"]
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "config/*", "manage.py", "scripts/*"]
