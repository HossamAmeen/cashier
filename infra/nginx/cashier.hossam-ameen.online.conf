# Simple POS: cashier.hossam-ameen.online (FINAL variant, HTTP -> HTTPS, proxy to 127.0.0.1:8121)
# Managed by infra/scripts/bootstrap.sh. Requires /etc/letsencrypt/live/simple-pos/.
# Deliberately no "http2" on listen: on nginx 1.24 it is a per-socket option, and adding it
# here would silently change the delivery/dental vhosts that share *:443.
server {
    listen 80;
    listen [::]:80;
    server_name cashier.hossam-ameen.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cashier.hossam-ameen.online;

    ssl_certificate     /etc/letsencrypt/live/simple-pos/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simple-pos/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/simple-pos/current/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
