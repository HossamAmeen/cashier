      - NO_OPEN_SHIFT
      - ORDER_NOT_EDITABLE
      - INSUFFICIENT_CASH
      - IDEMPOTENCY_CONFLICT
      - VALIDATION_ERROR
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Paid (first time or replay).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResultEnvelope'
          headers:
            Idempotent-Replayed:
