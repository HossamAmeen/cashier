components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: pos_refresh
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    DateFrom:
      name: date_from
      in: query
      required: false
      description: Inclusive Cairo calendar date (ADR-0013).
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      required: false
      description: Inclusive Cairo calendar date (ADR-0013).
      schema:
        type: string
        format: date
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: BR-PAY-04 / ADR-0007. 8–128 chars `[A-Za-z0-9_-]` (the PWA sends a UUID v4 per attempt); missing or malformed
        → VALIDATION_ERROR. Scoped per user; the request hash covers the path order id and the body, so reusing a key on another
        order or with another body → IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]{8,128}$
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF guard for cookie-authenticated endpoints (ADR-0003). Missing/wrong → UNAUTHENTICATED.
      schema:
        type: string
        enum:
        - simple-pos
  responses:
    Error401:
      description: INVALID_CREDENTIALS (login) or UNAUTHENTICATED (missing/invalid/expired/revoked session).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: FORBIDDEN_ROLE, NOT_ORDER_OWNER, or USER_DISABLED (login).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: State conflict — see the operation's x-error-codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: VALIDATION_ERROR, ORDER_EMPTY, DISCOUNT_INVALID or INSUFFICIENT_CASH.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: TOO_MANY_ATTEMPTS (BR-AUTH-03 on login; generic throttles elsewhere, ADR-0009).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Role:
      type: string
      enum:
      - ADMIN
      - CASHIER
      description: BR §2 User, BR §3.
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
    CatalogStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      description: Category/Item status.
    CategoryIcon:
      type: string
      description: Fixed built-in icon set (BR-ITEM-07, OQ-33). Keys are rendered by the PWA; no uploads. The 20 keys were
        approved by the owner at GATE B (D4).
      enum:
      - coffee
      - tea
      - juice
      - soft_drink
      - water
      - breakfast
      - sandwich
      - burger
      - pizza
      - grill
      - chicken
      - pasta
      - rice
      - salad
      - soup
      - appetizer
      - dessert
      - cake
      - ice_cream
      - bakery
    TableStatus:
      type: string
      enum:
      - AVAILABLE
      - OCCUPIED
      description: Derived, never stored (BR-TBL-01).
    ShiftStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
    OrderType:
      type: string
      enum:
      - DINE_IN
      - TAKEAWAY
    OrderStatus:
      type: string
      enum:
      - OPEN
      - PAID
      - CANCELLED
    PaymentMethod:
      type: string
      enum:
      - CASH
      - CARD
      description: BR-PAY-01.
    ErrorCode:
      type: string
      description: BR §9 codes (BR-GEN-06). The HTTP status of each code is fixed by BR §9. `INTERNAL_ERROR` (500) is technical,
        not a business rejection; approved by the owner at GATE B (D3) and added to BR §9 in BR v1.3 (ADR-0010).
      enum:
      - INVALID_CREDENTIALS
      - USER_DISABLED
      - TOO_MANY_ATTEMPTS
      - FORBIDDEN_ROLE
      - SHIFT_ALREADY_OPEN
      - NO_OPEN_SHIFT
      - SHIFT_HAS_OPEN_ORDERS
      - TABLE_OCCUPIED
      - TABLE_INACTIVE
      - ITEM_INACTIVE
      - ORDER_EMPTY
      - ORDER_NOT_EDITABLE
      - NOT_ORDER_OWNER
      - DISCOUNT_INVALID
      - INSUFFICIENT_CASH
      - ITEM_IN_USE
      - CATEGORY_NOT_EMPTY
      - USER_HAS_OPEN_SHIFT
      - LAST_ADMIN
      - VALIDATION_ERROR
      - UNAUTHENTICATED
      - NOT_FOUND
      - DUPLICATE_VALUE
      - IDEMPOTENCY_CONFLICT
      - INTERNAL_ERROR
    Pagination:
      type: object
      required:
      - page
      - page_size
      - total_items
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 1
    ErrorDetails:
      type: object
      description: Always present, may be empty. Known keys per code (ADR-0010).
      properties:
        fields:
          type: object
          description: 'VALIDATION_ERROR: field path → machine hints (English, never shown).'
          additionalProperties:
            type: array
            items:
              type: string
        open_order_numbers:
          type: array
          items:
            type: integer
          description: SHIFT_HAS_OPEN_ORDERS (BR-SHIFT-04).
        retry_after_seconds:
          type: integer
          nullable: true
          description: TOO_MANY_ATTEMPTS.
        item_ids:
          type: array
          items:
            type: integer
          description: ITEM_INACTIVE (BR-ITEM-01).
        field:
          type: string
          description: 'DUPLICATE_VALUE: the unique field (BR §9).'
      additionalProperties: true
    Error:
      type: object
      required:
      - success
      - code
      - message
      - details
      properties:
        success:
          type: boolean
          enum:
          - false
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Arabic message from BR §9, verbatim.
        details:
          $ref: '#/components/schemas/ErrorDetails'
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - healthy
    CurrentUser:
      type: object
      description: The authenticated user (BR-AUTH-04 routing uses `role`).
      required:
      - id
      - name
      - username
      - role
      - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Case-insensitive.
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        remember_me:
          type: boolean
          default: false
          description: 'OQ-6: true → 7-day persistent cookie; false → session cookie.'
    AuthSession:
      type: object
      required:
      - access_token
      - token_type
      - access_expires_in
      - user
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        access_expires_in:
          type: integer
          description: Seconds (900, ADR-0011).
        user:
          $ref: '#/components/schemas/CurrentUser'
    User:
      type: object
      required:
      - id
      - name
      - username
      - role
      - status
      - last_login_at
      - created_at
      - has_open_shift
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        username:
          type: string
          description: Stored lower-case, `[a-z0-9._]{3,32}`.
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        last_login_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
          nullable: true
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
        has_open_shift:
          type: boolean
          description: Lets the UI explain BR-USR-03/05 before submitting.
    UserCreate:
      type: object
      required:
      - name
      - username
      - password
      - role
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        username:
          type: string
          pattern: ^[A-Za-z0-9._]{3,32}$
          description: Lower-cased by the server, then must match `[a-z0-9._]{3,32}` (BR §2 User).
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: BR-USR-01. Never returned by any endpoint.
        role:
          $ref: '#/components/schemas/Role'
        status:
          allOf:
          - $ref: '#/components/schemas/UserStatus'
          default: ACTIVE
    UserUpdate:
      type: object
      description: Partial update; omitted fields are unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        username:
          type: string
          pattern: ^[A-Za-z0-9._]{3,32}$
          description: Lower-cased by the server, then must match `[a-z0-9._]{3,32}` (BR §2 User).
        password:
          type: string
          maxLength: 128
          format: password
          description: 'BR-USR-01: empty string or omitted = unchanged; otherwise ≥ 8 chars. A change revokes the user''s
            sessions (OQ-31).'
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
    UserCounts:
      type: object
      description: Tab counts on screen 18 (ignore filters).
      required:
      - all
      - admin
      - cashier
      properties:
        all:
          type: integer
        admin:
          type: integer
        cashier:
          type: integer
    UserPage:
      type: object
      required:
      - items
      - pagination
      - counts
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
        counts:
          $ref: '#/components/schemas/UserCounts'
    ShiftRef:
      type: object
      required:
      - id
      - code
      - opened_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
          example: SH-0312
        opened_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
    CashierListItem:
      type: object
      required:
      - id
      - name
      - username
      - status
      - last_login_at
      - current_shift
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        username:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        last_login_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
          nullable: true
        current_shift:
          allOf:
          - $ref: '#/components/schemas/ShiftRef'
          nullable: true
    CashierCounts:
      type: object
      required:
      - all
      - active
      - disabled
      properties:
        all:
          type: integer
        active:
          type: integer
        disabled:
          type: integer
    CashierPage:
      type: object
      required:
      - items
      - pagination
      - counts
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CashierListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
        counts:
          $ref: '#/components/schemas/CashierCounts'
    ShiftLive:
      type: object
      required:
      - id
      - code
      - opened_at
      - orders_count
      - sales_total_minor
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
        opened_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
        orders_count:
          type: integer
          description: PAID orders only (BR-SHIFT-05).
        sales_total_minor:
          type: integer
          format: int64
          description: Σ total of PAID orders (BR-SHIFT-05). Integer minor units (BR-GEN-01).
    CashierDetail:
      type: object
      required:
      - id
      - name
      - username
      - role
      - status
      - created_at
      - last_login_at
      - current_shift
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
          - CASHIER
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
        last_login_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
          nullable: true
        current_shift:
          allOf:
          - $ref: '#/components/schemas/ShiftLive'
          nullable: true
    Settings:
      type: object
      description: Singleton (BR-SET-01). Only these two fields exist (BR-SET-03, US-28.6).
      required:
      - business_name
      - receipt_footer
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 80
        receipt_footer:
          type: string
          maxLength: 200
    SettingsUpdate:
      type: object
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed; empty/whitespace → VALIDATION_ERROR (BR-SET-01). Max 80 = GATE B D2.
        receipt_footer:
          type: string
          maxLength: 200
          description: May be empty (BR-SET-01). Max 200 = GATE B D2.
    Category:
      type: object
      required:
      - id
      - name
      - sort_order
      - status
      - icon
      - item_count
      - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        sort_order:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/CatalogStatus'
        icon:
          allOf:
          - $ref: '#/components/schemas/CategoryIcon'
          nullable: true
        item_count:
          type: integer
          description: All items in the category, any status (screen 08).
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
    CategoryCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique (DUPLICATE_VALUE).
        sort_order:
          type: integer
          minimum: 0
          default: 0
        status:
          allOf:
          - $ref: '#/components/schemas/CatalogStatus'
          default: ACTIVE
        icon:
          allOf:
          - $ref: '#/components/schemas/CategoryIcon'
          nullable: true
          default: null
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique (DUPLICATE_VALUE).
        sort_order:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/CatalogStatus'
        icon:
          allOf:
          - $ref: '#/components/schemas/CategoryIcon'
          nullable: true
    Item:
      type: object
      required:
      - id
      - category_id
      - category_name
      - category_icon
      - name
      - price_minor
      - description
      - status
      - in_use
      - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        category_id:
          type: integer
          format: int64
          minimum: 1
        category_name:
          type: string
        category_icon:
          allOf:
          - $ref: '#/components/schemas/CategoryIcon'
          nullable: true
          description: BR-ITEM-07.
        name:
          type: string
        price_minor:
          type: integer
          format: int64
          description: Price (> 0, BR-ITEM-02). Integer minor units (BR-GEN-01).
          minimum: 1
        description:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/CatalogStatus'
        in_use:
          type: boolean
          description: Referenced by an order line → delete gives ITEM_IN_USE.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
    ItemCreate:
      type: object
      required:
      - category_id
      - name
      - price_minor
      properties:
        category_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Unique within its category.
        price_minor:
          type: integer
          format: int64
          description: Price > 0 (BR-ITEM-02). The PWA converts "45.50" → 4550. Integer minor units (BR-GEN-01).
          minimum: 1
        description:
          type: string
          maxLength: 500
          default: ''
        status:
          allOf:
          - $ref: '#/components/schemas/CatalogStatus'
          default: ACTIVE
    ItemUpdate:
      type: object
      properties:
        category_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Unique within its category.
        price_minor:
          type: integer
          format: int64
          description: Price > 0 (BR-ITEM-02). Existing order lines keep their snapshot (BR-ITEM-03). Integer minor units
            (BR-GEN-01).
          minimum: 1
        description:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/CatalogStatus'
    ItemPage:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CatalogItem:
      type: object
      required:
      - id
      - name
      - price_minor
      - description
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        price_minor:
          type: integer
          format: int64
          description: Current price. Integer minor units (BR-GEN-01).
          minimum: 1
        description:
          type: string
    CatalogCategory:
      type: object
      required:
      - id
      - name
      - sort_order
      - icon
      - items
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        sort_order:
          type: integer
        icon:
          allOf:
          - $ref: '#/components/schemas/CategoryIcon'
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    Catalog:
      type: object
      description: ACTIVE categories (sort_order, then name — BR-ITEM-06) with their ACTIVE items (BR-ITEM-01).
      required:
      - categories
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCategory'
    TableCurrentOrder:
      type: object
      required:
      - id
      - number
      - item_count
      - total_minor
      - cashier_id
      - cashier_name
      - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        number:
          type: integer
          description: Order number, e.g. 1048 (BR-ORD-10).
        item_count:
          type: integer
          description: Σ qty (BR-TBL-04).
        total_minor:
          type: integer
          format: int64
          description: Order total after discount (BR-TBL-04, OQ-14). Integer minor units (BR-GEN-01).
        cashier_id:
          type: integer
          format: int64
          minimum: 1
        cashier_name:
          type: string
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
    Table:
      type: object
      required:
      - id
      - number
      - is_active
      - status
      - current_order
      - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        number:
          type: integer
          minimum: 1
        is_active:
          type: boolean
        status:
          $ref: '#/components/schemas/TableStatus'
        current_order:
          allOf:
          - $ref: '#/components/schemas/TableCurrentOrder'
          nullable: true
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
    TableCounts:
      type: object
      required:
      - all
      - available
      - occupied
      properties:
        all:
          type: integer
        available:
          type: integer
        occupied:
          type: integer
    TableList:
      type: object
      description: Not paginated (a floor has few tables). Ordered by number ascending.
      required:
      - items
      - counts
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Table'
        counts:
          $ref: '#/components/schemas/TableCounts'
    TableCreate:
      type: object
      required:
      - number
      properties:
        number:
          type: integer
          minimum: 1
        is_active:
          type: boolean
          default: true
    TableUpdate:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
        is_active:
          type: boolean
    Shift:
      type: object
      required:
      - id
      - code
      - cashier_id
      - cashier_name
      - status
      - opened_at
      - closed_at
      - opening_balance_minor
      - sales_total_minor
      - cash_total_minor
      - card_total_minor
      - orders_count
      - open_orders_count
      - open_order_numbers
      - expected_cash_minor
      - counted_cash_minor
      - difference_minor
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
          description: '"SH-" + id zero-padded to 4 (OQ-35).'
        cashier_id:
          type: integer
          format: int64
          minimum: 1
        cashier_name:
          type: string
        status:
          $ref: '#/components/schemas/ShiftStatus'
        opened_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
        closed_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
          nullable: true
        opening_balance_minor:
          type: integer
          format: int64
          description: BR-SHIFT-02. Integer minor units (BR-GEN-01).
          minimum: 0
        sales_total_minor:
          type: integer
          format: int64
          description: Σ total of PAID orders (BR-SHIFT-05). Live if OPEN, snapshot if CLOSED. Integer minor units (BR-GEN-01).
        cash_total_minor:
          type: integer
          format: int64
          description: Σ total of PAID CASH orders (BR-SHIFT-05). Integer minor units (BR-GEN-01).
        card_total_minor:
          type: integer
          format: int64
          description: Σ total of PAID CARD orders (BR-SHIFT-05). Integer minor units (BR-GEN-01).
        orders_count:
          type: integer
          description: Count of PAID orders (BR-SHIFT-05).
        open_orders_count:
          type: integer
          description: OPEN orders in this shift (OQ-15).
        open_order_numbers:
          type: array
          items:
            type: integer
          description: OPEN order numbers (BR-SHIFT-04; screen 05 disables close).
        expected_cash_minor:
          type: integer
          format: int64
          description: opening_balance + cash_total (BR-SHIFT-06). Integer minor units (BR-GEN-01).
        counted_cash_minor:
          type: integer
          format: int64
          description: Entered on close (BR-SHIFT-07); null while OPEN. Integer minor units (BR-GEN-01).
          nullable: true
        difference_minor:
          type: integer
          format: int64
          description: counted − expected (BR-SHIFT-07); < 0 عجز, > 0 زيادة, 0 مطابق (OQ-36); null while OPEN. Integer minor
            units (BR-GEN-01).
          nullable: true
    ShiftSummary:
      type: object
      description: Row of the shift history table (screen 17, admin الورديات — OQ-12 (a)).
      required:
      - id
      - code
      - cashier_id
      - cashier_name
      - status
      - opened_at
      - closed_at
      - orders_count
      - sales_total_minor
      - difference_minor
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
        cashier_id:
          type: integer
          format: int64
          minimum: 1
        cashier_name:
          type: string
        status:
          $ref: '#/components/schemas/ShiftStatus'
        opened_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
        closed_at:
          type: string
          format: date-time
          description: RFC 3339 UTC (BR-GEN-02).
          nullable: true
        orders_count:
          type: integer
        sales_total_minor:
          type: integer
          format: int64
          description: BR-SHIFT-05. Integer minor units (BR-GEN-01).
        difference_minor:
          type: integer
          format: int64
          description: Snapshot; null while OPEN. Integer minor units (BR-GEN-01).
          nullable: true
    ShiftPage:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShiftSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ShiftOpen:
      type: object
      required:
      - opening_balance_minor
      properties:
        opening_balance_minor:
          type: integer
          format: int64
          description: ≥ 0 (BR-SHIFT-02). `opened_at` is always server time. Integer minor units (BR-GEN-01).
          minimum: 0
    ShiftClose:
      type: object
      required:
      - counted_cash_minor
      properties:
        counted_cash_minor:
          type: integer
          format: int64
