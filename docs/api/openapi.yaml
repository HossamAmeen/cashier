    post:
      operationId: createOrder
      tags:
      - orders
      summary: Confirm a new order — "تأكيد الطلب" (screen 11)
      description: |-
        Creates the order (status OPEN) from the client cart (BR-ORD-01) in one transaction (ADR-0006):
        - caller must have an OPEN shift → else `NO_OPEN_SHIFT` (BR-SHIFT-03); the order belongs to the caller and that shift
          (BR-ORD-03);
        - `lines` empty → `ORDER_EMPTY` (BR-ORD-02); qty integer ≥ 1; note ≤ 140;
        - every item must be ACTIVE in an ACTIVE category at confirm time → else `ITEM_INACTIVE` with `details.item_ids`, no
          order created (BR-ITEM-01, OQ-22); snapshots of name and current price are stored (BR-ITEM-03);
        - lines with the same item and equal note are merged (qty summed) (BR-ORD-05);
        - DINE_IN requires `table_id` of an active table (`TABLE_INACTIVE`) with no OPEN order (`TABLE_OCCUPIED`, enforced by
          the partial unique index under concurrency — BR-TBL-02/03, AC-04); TAKEAWAY must have no table (`VALIDATION_ERROR`)
          (BR-ORD-04); unknown `table_id`/`item_id` → `NOT_FOUND` (BR §9, US-23.8);
        - totals computed by the server (BR-ORD-06, BR-GEN-03); 0 ≤ discount ≤ subtotal else `DISCOUNT_INVALID` (BR-ORD-07);
        - `number` from the global sequence starting at 1001 (BR-ORD-10).
        ADMIN → `FORBIDDEN_ROLE` (BR-ROLE-02). No offline queueing (BR §0).

        Check order (first failure wins): `UNAUTHENTICATED` → `FORBIDDEN_ROLE` → `VALIDATION_ERROR` (body shape, type/table
        pairing) → `NO_OPEN_SHIFT` → `ORDER_EMPTY` → `NOT_FOUND` (table/item ids) → `ITEM_INACTIVE` → `TABLE_INACTIVE` →
        `TABLE_OCCUPIED` → `DISCOUNT_INVALID`.

