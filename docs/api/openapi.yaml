    put:
      operationId: updateOrder
      tags:
      - orders
      summary: Edit an OPEN order (screen 11 edit mode)
      description: |-
        Replaces the line list and discount of an OPEN order owned by the caller, in one transaction with the order row locked.
        Checks in order: ADMIN → `FORBIDDEN_ROLE` (BR-ROLE-02); not the owner → `NOT_ORDER_OWNER` (BR-ROLE-06); caller has
        no OPEN shift → `NO_OPEN_SHIFT` (BR-SHIFT-03); not OPEN → `ORDER_NOT_EDITABLE` (BR-ORD-08, AC-05).
        Line semantics: a line with `id` keeps its price/name snapshot and may change qty/note (BR-ITEM-03); lines without `id`
        are new at the current price; a new line merges into an existing one only if item, note and unit price snapshot are
        equal (BR-ORD-05, OQ-21); existing lines not listed are removed. A DISABLED item's existing line may be lowered or
        removed but not raised or re-added → `ITEM_INACTIVE` (OQ-23); changing its note is allowed. Empty list → `ORDER_EMPTY`
        (cancel is a separate operation). Discount rules as on create; never auto-clamped (OQ-20). Type and table cannot change
        (OQ-18): a body containing `type` or `table_id` (or any other unknown field) → `VALIDATION_ERROR`. A line `id` that does
        not belong to this order, or an existing line `id` sent with a different `item_id` → `VALIDATION_ERROR`. An unknown
        `item_id` on a new line → `NOT_FOUND` (BR §9, US-23.8).

        Check order: `UNAUTHENTICATED` → `FORBIDDEN_ROLE` → `NOT_FOUND` (path id) → `VALIDATION_ERROR` (body) →
        `NOT_ORDER_OWNER` → `NO_OPEN_SHIFT` → `ORDER_NOT_EDITABLE` → `ORDER_EMPTY` → `NOT_FOUND` (item ids) → `ITEM_INACTIVE` →
