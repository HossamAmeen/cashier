# Simple POS — API contract (contract-first, ADR-0008). Owner: team-lead. Reviewed by: product-analyst.
# Status: APPROVED at GATE B (2026-09-29); P2-04 applied docs/api/contract-review.md. Rank 2 (CLAUDE.md §2).
# Do not edit from backend/frontend roles; propose changes to the team-lead.
openapi: 3.0.3
info:
  title: Simple POS API
  version: 1.0.0
  description: |-
    Contract-first API for Simple POS (ADR-0008). Precedence: BUSINESS_RULES.md (BR v1.2) > this file > the UI/UX PDF > code.

    **Hosts**: API `https://api.cashier.hossam-ameen.online`, PWA `https://cashier.hossam-ameen.online` (separate origins,
    CORS limited to the PWA origin, ADR-0003).

    **Conventions** (ADR-0005, 0008, 0010, 0013)
    - Paths have no trailing slash. JSON is snake_case. Ids are integers. Timestamps are RFC 3339 UTC.
    - **Money is always an integer number of minor units (piastres) in a field ending in `_minor`** (BR-GEN-01). The server
      computes every total, change, expected cash and difference (BR-GEN-03).
    - Success body: `{success: true, message, data}`; lists: `data = {items, pagination, …}`; 204 has no body.
    - Error body: `{success: false, code, message, details}`; `code` is a BR §9 code with its BR §9 HTTP status and Arabic
      `message` (BR-GEN-06).
    - Auth: `Authorization: Bearer <access_token>` (15 min). The refresh token is an httpOnly cookie on the API host only,
      used by `/api/auth/refresh` and `/api/auth/logout` with `X-Requested-With: simple-pos` (ADR-0003, ADR-0011).
    - `x-roles` lists the roles allowed to call each operation (`PUBLIC`, `ANY_AUTHENTICATED`, `ADMIN`, `CASHIER`); every
      other authenticated role gets `FORBIDDEN_ROLE` (BR-ROLE-05). `x-br` lists the rules the operation enforces and
      `x-error-codes` the §9 codes it may return.
    - Check precedence: `UNAUTHENTICATED` → `FORBIDDEN_ROLE` (role) → `NOT_FOUND` (path id) → `VALIDATION_ERROR` (body
      shape) → ownership (`NOT_ORDER_OWNER`, or `FORBIDDEN_ROLE` for another cashier's shift/order) → state/business codes.
      A non-existent id referenced in the **body** (`table_id`, `item_id`, `category_id`) → `NOT_FOUND` (BR §9, US-23.8),
      checked after body shape. Operations with several business codes state their full order in their description.

    **GATE B decisions (approved by the owner on 2026-09-29; contract review P2-02 applied in P2-04)**
    - D1: a CASHIER reading another cashier's existing shift, or another cashier's order that is not OPEN DINE_IN, gets
      `FORBIDDEN_ROLE` (403); a non-existent id gets `NOT_FOUND`. The same applies to a CASHIER passing someone else's
      `cashier_id` or `shift_id` to `/api/orders`, or `cashier_id` to `/api/shifts`.
    - D2: text limits — Settings `business_name` 1–80, `receipt_footer` 0–200; user `name` 1–100; category `name` 1–50;
      item `name` 1–80; cancel `reason` 3–200; order line `qty` 1–999 (recorded in BR §2 by the PA in v1.3).
    - D3: `INTERNAL_ERROR` (500) "حدث خطأ غير متوقع، حاول مرة أخرى" (BR §9 v1.3); offline banner (UI only) "لا يوجد اتصال
      بالإنترنت — لا يمكن تنفيذ العمليات حتى يعود الاتصال".
    - D4: the fixed category icon set (BR-ITEM-07) is the 20 keys of `CategoryIcon`.
    - D5: closing an already CLOSED shift → `NO_OPEN_SHIFT`; a receipt for a non-PAID order → `NOT_FOUND`.
    - D6: every 429 (BR-AUTH-03 and the generic API throttles) uses `TOO_MANY_ATTEMPTS`.
  x-business-rules-version: '1.3'
servers:
- url: https://api.cashier.hossam-ameen.online
  description: Single environment (ADR-0004)
security:
- bearerAuth: []
tags:
- name: health
- name: auth
  description: Slice 1 — BR-AUTH-*
- name: users
  description: Slice 2 — BR-USR-*
- name: cashiers
  description: Slice 2 — cashier projection
- name: settings
  description: Slice 2 — BR-SET-*
- name: catalog
  description: Slice 3 — BR-ITEM-*
- name: tables
  description: Slice 4 — BR-TBL-*
- name: shifts
  description: Slices 5 and 8 — BR-SHIFT-*
- name: orders
  description: Slices 6 and 9 — BR-ORD-*
- name: payments
  description: Slice 7 — BR-PAY-*
- name: dashboard
  description: Slice 10
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
      - health
      summary: Liveness check
      description: |-
        Returns healthy when the Django app runs (DRF_SKILL §23–27). Requires the health token, preferably in the `X-Health-Check-Token` header (the `password` query parameter is also accepted). Not a business endpoint.

        BR: —.
        Errors: `UNAUTHENTICATED`, `TOO_MANY_ATTEMPTS`.
      x-roles:
      - PUBLIC
      x-br:
      - —
      x-error-codes:
      - UNAUTHENTICATED
      - TOO_MANY_ATTEMPTS
      security: []
      parameters:
      - name: X-Health-Check-Token
        in: header
        required: false
        schema:
          type: string
      - name: password
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
  /api/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Log in with username + password
      description: |-
        Authenticates by username (case-insensitive) and password (BR-AUTH-01; username only, OQ-4). On success returns an
        access token (15 min) and the user, sets the httpOnly refresh cookie `pos_refresh` (host-only, `Path=/api/auth/`,
        `SameSite=Strict`, `Max-Age` 7 days if `remember_me`, else a session cookie — OQ-6, ADR-0003/0011) and sets
        `last_login_at`. The PWA routes by `user.role` (BR-AUTH-04).

        Order of checks (OQ-30): (1) ≥ 5 failed attempts for this username+IP in the last 5 minutes → `TOO_MANY_ATTEMPTS`
        even with a correct password (BR-AUTH-03); (2) unknown username or wrong password → `INVALID_CREDENTIALS`
        with an identical body (BR-AUTH-01) and a failure is recorded; (3) correct password but DISABLED → `USER_DISABLED`
        (BR-AUTH-02); (4) success clears the failure counter.

        BR: BR-AUTH-01, BR-AUTH-02, BR-AUTH-03, BR-AUTH-04, OQ-4, OQ-6, OQ-30, AC-12, AC-13.
        Errors: `INVALID_CREDENTIALS`, `USER_DISABLED`, `TOO_MANY_ATTEMPTS`, `VALIDATION_ERROR`.
      x-roles:
      - PUBLIC
      x-br:
      - BR-AUTH-01
      - BR-AUTH-02
      - BR-AUTH-03
      - BR-AUTH-04
      - OQ-4
      - OQ-6
      - OQ-30
      - AC-12
      - AC-13
      x-error-codes:
      - INVALID_CREDENTIALS
      - USER_DISABLED
      - TOO_MANY_ATTEMPTS
      - VALIDATION_ERROR
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: pos_refresh=…; HttpOnly; Secure; SameSite=Strict; Path=/api/auth/
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
  /api/auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - auth
      summary: Get a new access token from the refresh cookie
      description: |-
        Reads `pos_refresh`, rotates it (the old one is blacklisted) and returns a new access token plus the current user.
        Requires `X-Requested-With: simple-pos` and an allowed `Origin` (CSRF guard, ADR-0003). A missing/invalid/expired/
        revoked cookie, a DISABLED user, or a stale token version (password/role change, disable) → `UNAUTHENTICATED`
        (BR-AUTH-02, OQ-31). No request body.

        BR: BR-AUTH-02, OQ-6, OQ-31.
        Errors: `UNAUTHENTICATED`, `TOO_MANY_ATTEMPTS`.
      x-roles:
      - PUBLIC
      x-br:
      - BR-AUTH-02
      - OQ-6
      - OQ-31
      x-error-codes:
      - UNAUTHENTICATED
      - TOO_MANY_ATTEMPTS
      security:
      - refreshCookie: []
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
  /api/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: End this device's session
      description: |-
        Blacklists the refresh token from the cookie and clears the cookie. Always allowed, also with an OPEN shift, which stays
        OPEN (OQ-29). Used after closing a shift (BR-SHIFT-09). Requires `X-Requested-With: simple-pos` (ADR-0003). Idempotent:
        a missing or already-revoked cookie still returns 204.

        BR: BR-SHIFT-09, OQ-29.
        Errors: `UNAUTHENTICATED`, `TOO_MANY_ATTEMPTS`.
      x-roles:
      - PUBLIC
      x-br:
      - BR-SHIFT-09
      - OQ-29
      x-error-codes:
      - UNAUTHENTICATED
      - TOO_MANY_ATTEMPTS
      security:
      - refreshCookie: []
      parameters:
      - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          description: No content.
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
  /api/auth/me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: Current user
      description: |-
        The authenticated user (profile page "الحساب", OQ-13; header name/role, US-27).

        BR: BR-AUTH-04, OQ-13.
        Errors: `UNAUTHENTICATED`.
      x-roles:
      - ANY_AUTHENTICATED
      x-br:
      - BR-AUTH-04
      - OQ-13
      x-error-codes:
      - UNAUTHENTICATED
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
  /api/users:
    get:
      operationId: listUsers
      tags:
      - users
      summary: List users (screen 18)
      description: |-
        All users, newest first, with tab counts. `search` matches name or username (US-18.1). ADMIN only (BR-ROLE-01).

        BR: BR-ROLE-01, BR-ROLE-05, AC-11.
        Errors: `UNAUTHENTICATED`, `FORBIDDEN_ROLE`.
      x-roles:
      - ADMIN
      x-br:
      - BR-ROLE-01
      - BR-ROLE-05
      - AC-11
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN_ROLE
      parameters:
      - name: role
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Role'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserStatus'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
    post:
      operationId: createUser
      tags:
      - users
      summary: Create a user (screen 19)
      description: |-
        Creates an ADMIN or CASHIER. Username is lower-cased then must match `[a-z0-9._]{3,32}` (else `VALIDATION_ERROR`) and be
        unique case-insensitively (else `DUPLICATE_VALUE`). Password ≥ 8, stored as argon2id, never returned (BR-USR-01).

        BR: BR-ROLE-01, BR-USR-01, BR §2 User.
        Errors: `UNAUTHENTICATED`, `FORBIDDEN_ROLE`, `DUPLICATE_VALUE`, `VALIDATION_ERROR`.
      x-roles:
      - ADMIN
      x-br:
      - BR-ROLE-01
      - BR-USR-01
      - BR §2 User
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN_ROLE
      - DUPLICATE_VALUE
      - VALIDATION_ERROR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
  /api/users/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getUser
      tags:
      - users
      summary: Get a user
      description: |-
        One user (screen 19 edit mode). ADMIN only.

        BR: BR-ROLE-01.
        Errors: `UNAUTHENTICATED`, `FORBIDDEN_ROLE`, `NOT_FOUND`.
      x-roles:
      - ADMIN
      x-br:
      - BR-ROLE-01
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN_ROLE
      - NOT_FOUND
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
    patch:
      operationId: updateUser
      tags:
      - users
      summary: Update, disable, enable or change role of a user (screens 16–19)
      description: |-
        Partial update. There is no delete (BR-USR-02). Rules:
        - empty/omitted `password` = unchanged; otherwise ≥ 8 (BR-USR-01); a change revokes the user's sessions (OQ-31);
        - `status: DISABLED` for a user with an OPEN shift → `USER_HAS_OPEN_SHIFT` (BR-USR-03); a successful disable revokes all
          their sessions immediately (BR-AUTH-02);
        - changing `role` while the user has an OPEN shift → `USER_HAS_OPEN_SHIFT` (BR-USR-05);
        - disabling or demoting the last ACTIVE ADMIN → `LAST_ADMIN` (BR-USR-04), including an admin acting on themselves
          (OQ-37);
        - username rules as in createUser (`DUPLICATE_VALUE`); the username is editable (OQ-31);
        - a **role change also revokes** the user's sessions (security measure so a stale role never authorizes a call,
          BR-ROLE-05; PA ruling, contract review #10), like disable and password change (ADR-0011).

        BR: BR-ROLE-01, BR-ROLE-05, BR-USR-01, BR-USR-02, BR-USR-03, BR-USR-04, BR-USR-05, BR-AUTH-02, OQ-31, OQ-37, AC-11, AC-12.
        Errors: `UNAUTHENTICATED`, `FORBIDDEN_ROLE`, `NOT_FOUND`, `USER_HAS_OPEN_SHIFT`, `LAST_ADMIN`, `DUPLICATE_VALUE`, `VALIDATION_ERROR`.
      x-roles:
      - ADMIN
      x-br:
      - BR-ROLE-01
      - BR-ROLE-05
      - BR-USR-01
      - BR-USR-02
      - BR-USR-03
      - BR-USR-04
      - BR-USR-05
      - BR-AUTH-02
      - OQ-31
      - OQ-37
      - AC-11
      - AC-12
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN_ROLE
      - NOT_FOUND
      - USER_HAS_OPEN_SHIFT
      - LAST_ADMIN
      - DUPLICATE_VALUE
      - VALIDATION_ERROR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
  /api/cashiers:
    get:
      operationId: listCashiers
      tags:
      - cashiers
      summary: Cashiers projection (screen 16)
      description: |-
        Users with role CASHIER plus their current OPEN shift (if any) and last login, with tab counts. Read-only projection of users + shifts (BR §2 User). Manage accounts via /api/users. ADMIN only.

        BR: BR-ROLE-01, BR §2 User.
        Errors: `UNAUTHENTICATED`, `FORBIDDEN_ROLE`.
      x-roles:
      - ADMIN
      x-br:
      - BR-ROLE-01
      - BR §2 User
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN_ROLE
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserStatus'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of cashiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierPageEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /api/cashiers/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getCashier
      tags:
      - cashiers
      summary: Cashier profile (screen 17)
      description: |-
        Profile, created_at (OQ-35) and the live totals of the current OPEN shift (BR-SHIFT-05). Shift history comes from `GET /api/shifts?cashier_id=…` (last 30 days by default in the UI, OQ-35). A non-CASHIER id → `NOT_FOUND`. ADMIN only.

        BR: BR-ROLE-01, BR-SHIFT-05, OQ-35.
        Errors: `UNAUTHENTICATED`, `FORBIDDEN_ROLE`, `NOT_FOUND`.
      x-roles:
      - ADMIN
      x-br:
      - BR-ROLE-01
      - BR-SHIFT-05
      - OQ-35
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN_ROLE
      - NOT_FOUND
      responses:
        '200':
          description: The cashier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierDetailEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /api/settings:
    get:
      operationId: getSettings
      tags:
      - settings
      summary: Read Settings
      description: |-
        The Settings singleton (business_name, receipt_footer). Any authenticated user may read it because the receipt uses it (BR-SET-02, BR-PAY-07).

        BR: BR-SET-01, BR-SET-02, BR-SET-03.
        Errors: `UNAUTHENTICATED`.
      x-roles:
      - ANY_AUTHENTICATED
      x-br:
      - BR-SET-01
      - BR-SET-02
      - BR-SET-03
      x-error-codes:
      - UNAUTHENTICATED
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
    patch:
      operationId: updateSettings
      tags:
      - settings
      summary: Update Settings (الإعدادات)
      description: |-
        ADMIN only (BR-SET-02). business_name trimmed and non-empty (BR-SET-01); receipt_footer may be empty. There is no create/delete, no currency and no logo (BR-SET-03).

        BR: BR-SET-01, BR-SET-02, BR-SET-03.
        Errors: `UNAUTHENTICATED`, `FORBIDDEN_ROLE`, `VALIDATION_ERROR`.
      x-roles:
      - ADMIN
      x-br:
      - BR-SET-01
      - BR-SET-02
      - BR-SET-03
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN_ROLE
      - VALIDATION_ERROR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
  /api/categories:
    get:
      operationId: listCategories
      tags:
      - catalog
      summary: List categories (screen 08)
      description: |-
        All categories ordered by sort_order then name (BR-ITEM-06), with item counts. ADMIN only; cashiers use /api/catalog.

        BR: BR-ROLE-01, BR-ITEM-06.
        Errors: `UNAUTHENTICATED`, `FORBIDDEN_ROLE`.
      x-roles:
      - ADMIN
      x-br:
      - BR-ROLE-01
      - BR-ITEM-06
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN_ROLE
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CatalogStatus'
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
    post:
      operationId: createCategory
      tags:
      - catalog
      summary: Create a category
      description: |-
        Name unique (`DUPLICATE_VALUE`); icon null or a key of the fixed set (BR-ITEM-07). ADMIN only.

        BR: BR-ROLE-01, BR-ITEM-07, BR §2 Category.
        Errors: `UNAUTHENTICATED`, `FORBIDDEN_ROLE`, `DUPLICATE_VALUE`, `VALIDATION_ERROR`.
      x-roles:
      - ADMIN
      x-br:
      - BR-ROLE-01
      - BR-ITEM-07
      - BR §2 Category
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN_ROLE
      - DUPLICATE_VALUE
      - VALIDATION_ERROR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
  /api/categories/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getCategory
      tags:
      - catalog
      summary: Get a category
      description: |-
        ADMIN only.

        BR: BR-ROLE-01.
        Errors: `UNAUTHENTICATED`, `FORBIDDEN_ROLE`, `NOT_FOUND`.
      x-roles:
      - ADMIN
