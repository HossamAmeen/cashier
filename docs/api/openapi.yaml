    post:
      operationId: payOrder
      tags:
      - payments
      summary: Pay an order — one payment, CASH or CARD (screen 13)
      description: |-
        One DB transaction (BR-PAY-04, ADR-0006/0007): lock the order row → idempotency lookup (replay or
        `IDEMPOTENCY_CONFLICT`) → ownership (`NOT_ORDER_OWNER`, BR-ROLE-06) → caller has an OPEN shift and the order belongs to
        it (`NO_OPEN_SHIFT`, BR-SHIFT-03) → order OPEN (`ORDER_NOT_EDITABLE`, BR-ORD-08) → method rules (`INSUFFICIENT_CASH`)
        → insert the single Payment (unique per order, BR-PAY-01) → set PAID with `paid_at`. The table becomes AVAILABLE
        (BR-PAY-05, BR-TBL-05). Before the lock: `UNAUTHENTICATED` → `FORBIDDEN_ROLE` → `NOT_FOUND` → `VALIDATION_ERROR`
        (body shape, missing/malformed `Idempotency-Key`, negative amount).
        - CASH: `amount_received_minor` required and ≥ total else `INSUFFICIENT_CASH`; change = received − total (BR-PAY-02).
        - CARD: `amount_received_minor` must be absent/null (else `VALIDATION_ERROR`); received = total, change = 0 (BR-PAY-03).
        Idempotency (`Idempotency-Key`, required, per user): same key + same order + same body → the original 201 response
        replayed with header `Idempotent-Replayed: true` and no second payment; same key with a different body **or a different
        order** → `IDEMPOTENCY_CONFLICT`; a different key on a PAID order → `ORDER_NOT_EDITABLE` (AC-07). Rejected attempts are not stored (ADR-0007). ADMIN → `FORBIDDEN_ROLE`.

        BR: BR-PAY-01, BR-PAY-02, BR-PAY-03, BR-PAY-04, BR-PAY-05, BR-TBL-05, BR-ORD-08, BR-SHIFT-03, BR-ROLE-02, BR-ROLE-06, BR-GEN-03, AC-01, AC-07, AC-08, AC-11.
