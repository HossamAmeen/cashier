# Simple POS: cashier.hossam-ameen.online (BOOTSTRAP variant, HTTP only)
# Managed by infra/scripts/bootstrap.sh. Installed until the "simple-pos" certificate exists.
# It only answers ACME HTTP-01 challenges. Everything else returns 404.
server {
    listen 80;
    listen [::]:80;
    server_name cashier.hossam-ameen.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
